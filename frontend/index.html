    <!-- Advanced Performance & Technical SEO -->
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="msapplication-TileColor" content="#667eea" />

    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    
    <!-- Resource hints for better performance -->
    <link rel="prefetch" href="/register" />
    <link rel="prefetch" href="/request-reply" />
    
    <!-- Security headers -->
    <!-- X-Content-Type-Options and X-Frame-Options are not honoured from a
         <meta> tag (browsers require a real HTTP response header for those,
         and log a console warning otherwise) - Django's own
         XFrameOptionsMiddleware already sends X-Frame-Options on every
         response, so it isn't duplicated here. -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    
    <!-- Note: no hreflang alternates are declared here. The French/English
         toggle is a client-side i18next switch, not separate URLs per
         locale, so there is no distinct French page to point hreflang at
         (a hreflang pointing back at the same English URL is meaningless
         and can confuse search engines about which language that URL is). -->

    <!-- Geographic targeting (Toronto + Durham Region, the actual service area) -->
    <meta name="geo.region" content="CA-ON" />
    <meta name="geo.placename" content="Toronto, Ontario" />
    <meta name="ICBM" content="43.7417, -79.0002" />
    <meta name="geo.position" content="43.7417;-79.0002" />
    
    <!-- Copyright and ownership -->
    <meta name="copyright" content="EGS Tutoring" />

    <meta name="distribution" content="global" />
    <meta name="revisit-after" content="7 days" />
